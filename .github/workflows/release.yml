name: Release

# Builds E-Rechnung-Konverter.exe for a version tag (e.g. v0.1.0), checks it on the
# fictitious sample invoice and attaches it to the GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m PyInstaller --noconfirm erechnung.spec
      - name: Selftest of the exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory selftest | Out-Null
          Copy-Item tests/sample/Musterrechnung.pdf, tests/sample/stammdaten.json selftest/
          $p = Start-Process dist/E-Rechnung-Konverter.exe -ArgumentList "--selftest", "selftest/Musterrechnung.pdf", "selftest/stammdaten.json" -Wait -PassThru
          Get-Content selftest/selftest.log
          if ($p.ExitCode -ne 0) { exit 1 }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/E-Rechnung-Konverter.exe
          body_path: CHANGELOG.md
